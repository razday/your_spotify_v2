services:
  server:
    image: ghcr.io/razday/your_spotify_v2_server:latest
    restart: always
    ports:
      - "8080:8080"
    links:
      - mongo
    depends_on:
      - mongo
    environment:
      API_ENDPOINT: http://127.0.0.1:8080 # This MUST be included as a valid URL in the spotify dashboard
      CLIENT_ENDPOINT: http://127.0.0.1:3000
      SPOTIFY_PUBLIC: __your_spotify_client_id__
      SPOTIFY_SECRET: __your_spotify_secret__
      # Recommended behind a reverse proxy (see README)
      # TRUST_PROXY: 1
      # LOGIN_RATE_LIMIT_PER_MINUTE: 3

  mongo:
    container_name: mongo
    image: mongo:8
    restart: always
    volumes:
      - ./your_spotify_db:/data/db

  web:
    image: ghcr.io/razday/your_spotify_v2_client:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      API_ENDPOINT: http://127.0.0.1:8080
